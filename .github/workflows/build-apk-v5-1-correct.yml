name: Build Dzikir Tasbih V5.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract project ZIP
        run: |
          unzip -o DzikrTasbih_v5_1_multi_penyimpanan_fix.zip -d project
          cd project
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dzikir-Tasbih-V5-1-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
