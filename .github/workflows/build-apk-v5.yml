name: Build Dzikr Tasbih V5
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extract V5 project
        run: unzip -o DzikrTasbih_v5_multi_penyimpanan.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Dzikr-Tasbih-V5-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
